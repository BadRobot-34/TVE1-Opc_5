<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Imagen a Pantalla Completa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-image {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      /* Usamos 'contain' para ver la imagen ENTERA sin recortes al girar.
         Si prefieres que rellene todo aunque corte bordes, cambia 'contain' por 'cover' */
      object-fit: contain; 
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>

  <img src="https://img.magnific.com/vector-gratis/banner-abstracto-contraccion-conexion_23-2148600068.jpg" alt="Imagen a pantalla completa" class="fullscreen-image">

</body>
</html>
