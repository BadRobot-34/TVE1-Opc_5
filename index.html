
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen a Pantalla Completa</title>
  <style>
    /* Eliminamos márgenes, rellenos y barras de desplazamiento por defecto */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita el scroll si la imagen se ajusta */
      background-color: #000; /* Fondo negro por si la imagen tarda en cargar */
    }

    /* La imagen cubre todo el viewport */
    .fullscreen-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Cubre todo el espacio sin deformarse (recorta los bordes sobrantes) */
      object-position: center; /* Centra la imagen */
      display: block;
    }
  </style>
</head>
<body>

  <img src="https://img.magnific.com/vector-gratis/banner-abstracto-contraccion-conexion_23-2148600068.jpg?semt=ais_hybrid&w=740&q=80" alt="Imagen a pantalla completa" class="fullscreen-image">

</body>
</html>
