<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Imagen a Pantalla Completa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Altura dinámica adaptable a giros en móviles */
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-image {
      width: 100%;
      height: 100%;
      width: 100dvw;
      height: 100dvh;
      object-fit: cover; /* Mantiene la proporción al rotar */
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>

  <img src="https://img.magnific.com/vector-gratis/banner-abstracto-contraccion-conexion_23-2148600068.jpg?semt=ais_hybrid&w=740&q=80" alt="Imagen a pantalla completa" class="fullscreen-image">

</body>
</html>
